name: Predeploy Check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint codebase
        run: npm run lint

      - name: Run unit & security tests
        run: npm run test

      - name: Build Next.js production bundle
        env:
          JWT_SECRET: "ci-build-verification-secret-32-chars-minimum"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/pressipro_ci?sslmode=disable"
        run: npx next build
