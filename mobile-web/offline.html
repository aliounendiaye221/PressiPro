<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hors connexion — PressiPro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px 24px;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: #2563eb;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 20px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 14px; color: #cbd5e1; line-height: 1.6; margin-bottom: 24px; }
    button {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">PP</div>
    <h1>Mode hors connexion</h1>
    <p>Impossible de joindre le serveur PressiPro pour le moment. Vérifiez votre connexion Wi-Fi ou données mobiles puis réessayez.</p>
    <button type="button" onclick="retryConnection()">Réessayer la connexion</button>
  </div>
  <script>
    var TARGET_URL = "https://pressipro.vercel.app";
    function retryConnection() {
      window.location.replace(TARGET_URL);
    }
    window.addEventListener("online", retryConnection);
  </script>
</body>
</html>
