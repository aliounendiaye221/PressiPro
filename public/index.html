<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PressiPro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo-container {
      width: 96px;
      height: 96px;
      background: #2563eb;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      color: #94a3b8;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-retry {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      transition: background 0.2s;
    }
    .btn-retry:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="logo-container">PP</div>
  <div class="spinner" id="spinner"></div>
  <h1>PressiPro</h1>
  <p id="status-text">Connexion à votre espace de gestion...</p>
  <button class="btn-retry" id="btn-retry" style="display: none;" onclick="window.location.reload()">Réessayer</button>

  <script>
    // Si l'application native a du réseau, redirige vers l'URL live si ce n'est pas déjà fait
    const PROD_URL = "https://pressipro.vercel.app";
    setTimeout(() => {
      if (navigator.onLine) {
        window.location.href = PROD_URL;
      } else {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("status-text").innerText = "Connexion Internet requise pour synchroniser vos commandes.";
        document.getElementById("btn-retry").style.display = "inline-block";
      }
    }, 1500);
  </script>
</body>
</html>
